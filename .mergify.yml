pull_request_rules:
  - name: label typelevel-steward's PRs
    conditions:
      - author=typelevel-steward[bot]
    actions:
      label:
        add: [':robot:']
  - name: label typelevel-steward's update PRs
    conditions:
      - author=typelevel-steward[bot]
      - body~=labels:.*library-update
    actions:
      label:
        add: [dependencies]
  - name: label dependabots's PRs
    conditions:
      - author=dependabot[bot]
    actions:
      label:
        add: [':robot:']
  - name: automatically merge dependabot docs PRs
    conditions:
      - author=dependabot[bot]
      - check-success=Generate Microsite
      - base=docs
    actions:
      merge:
        method: merge
  - name: mistargeted doc PRs
    conditions:
      - base == series/3.x
      - files ~= ^docs/
      - -files ~= ^(?!docs/)
    actions:
      comment: 
        message: "Documentation updates should target the current minor series branch, not series/3.x directly."
